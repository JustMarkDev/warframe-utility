[package]
name = "warframe-utility"
version = "0.4.9"
description = "Warframe Market Syndicate Automator"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "warframe_utility_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }

# RUSTSEC-2024-0429: glib 0.18.5 (pulled in by tauri's Linux GTK3 stack) has an
# unsound VariantStrIter; the fix only exists in glib >= 0.20, which gtk 0.18
# cannot use. See patches/README.md. Remove once tauri drops gtk3-rs 0.18.
[patch.crates-io]
glib = { path = "patches/glib" }
