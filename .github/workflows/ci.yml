name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: node
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build

  rust:
    name: Rust (${{ matrix.name }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@main

      # Tauri on Linux needs the webview and tray libraries.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@master
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test

  ci:
    name: CI
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, rust]
    steps:
      - name: Verify required job states
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
        run: test "$FRONTEND" = success && test "$RUST" = success

  release:
    name: Release
    needs: ci
    # always(): a skipped ancestor job would otherwise skip this job.
    if: always() && github.event_name == 'push' && needs.ci.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
